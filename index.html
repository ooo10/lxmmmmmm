<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIGC实训平台</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
    .login-container { display: flex; height: 100vh; }
    .left-panel { flex: 1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 40px; }
    .left-panel h1 { font-size: 2.5rem; margin-bottom: 15px; }
    .left-panel p { font-size: 1.1rem; opacity: 0.9; }
    .right-panel { flex: 1; background: #f8f9fa; display: flex; justify-content: center; align-items: center; padding: 40px; }
    .form-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .tabs { display: flex; margin-bottom: 25px; border-bottom: 1px solid #eee; }
    .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: 600; color: #666; border-bottom: 2px solid transparent; transition: all 0.3s; }
    .tab.active { color: #667eea; border-bottom-color: #667eea; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: #667eea; }
    .role-selector { display: flex; gap: 8px; margin-bottom: 20px; }
    .role-option { flex: 1; padding: 10px; text-align: center; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; }
    .role-option.active { border-color: #667eea; background: #f5f7ff; color: #667eea; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-secondary { background: #eee; color: #333; margin-top: 10px; }
    .btn-secondary:hover { background: #ddd; }
    .forgot-link { text-align: center; margin-top: 12px; color: #667eea; cursor: pointer; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app">
    <div class="login-container">
      <div class="left-panel">
        <h1>AIGC实训平台</h1>
        <p>开启您的AI创作之旅</p>
      </div>
      <div class="right-panel">
        <div class="form-box">
          <div class="tabs">
            <div class="tab" :class="{ active: activeTab === 'login' }" @click="activeTab = 'login'">登录</div>
            <div class="tab" :class="{ active: activeTab === 'register' }" @click="activeTab = 'register'">注册</div>
          </div>
          
          <div v-if="activeTab === 'login'">
            <div class="form-group"><label>邮箱</label><input type="email" v-model="loginForm.email" placeholder="请输入邮箱"></div>
            <div class="form-group"><label>密码</label><input type="password" v-model="loginForm.password" placeholder="请输入密码"></div>
            <div class="role-selector">
              <div class="role-option" :class="{ active: loginForm.role === 'teacher' }" @click="loginForm.role = 'teacher'">教师</div>
              <div class="role-option" :class="{ active: loginForm.role === 'student' }" @click="loginForm.role = 'student'">学生</div>
            </div>
            <button class="btn btn-primary" @click="handleLogin">登录</button>
            <div class="forgot-link">忘记密码？</div>
          </div>
          
          <div v-if="activeTab === 'register'">
            <div class="form-group"><label>邮箱</label><input type="email" v-model="registerForm.email" placeholder="请输入邮箱"></div>
            <div class="form-group"><label>用户名</label><input type="text" v-model="registerForm.username" placeholder="请输入用户名"></div>
            <div class="form-group"><label>密码</label><input type="password" v-model="registerForm.password" placeholder="请输入密码"></div>
            <div class="role-selector">
              <div class="role-option" :class="{ active: registerForm.role === 'teacher' }" @click="registerForm.role = 'teacher'">教师</div>
              <div class="role-option" :class="{ active: registerForm.role === 'student' }" @click="registerForm.role = 'student'">学生</div>
            </div>
            <button class="btn btn-primary" @click="handleRegister">注册</button>
            <button class="btn btn-secondary" @click="activeTab = 'login'">已有账号？登录</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive } = Vue;
    createApp({
      setup() {
        const activeTab = ref('login');
        const loginForm = reactive({ email: '', password: '', role: 'student' });
        const registerForm = reactive({ email: '', username: '', password: '', role: 'student' });
        const handleLogin = () => { alert('登录成功！角色: ' + loginForm.role); };
        const handleRegister = () => { alert('注册成功！用户名: ' + registerForm.username); };
        return { activeTab, loginForm, registerForm, handleLogin, handleRegister };
      }
    }).mount('#app');
  </script>
</body>
</html>
